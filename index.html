<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador Financiero de Acciones con IA</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent: #10b981; --text-main: #f8fafc; --border: #334155; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h1, h2 { color: var(--accent); margin-top: 0; }
    input[type="text"], textarea, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background-color: var(--accent); color: #000; width: 100%; }
    #output { background: #090d16; border: 1px solid var(--border); padding: 15px; border-radius: 8px; min-height: 100px; white-space: pre-wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Analizador de Acciones con IA</h1>
    
    <div class="card">
      <h2>🔑 1. Configuración API</h2>
      <input type="text" id="apiKey" placeholder="Pega tu API Key aquí">
    </div>

    <div class="card">
      <h2>📊 2. Datos de Acciones</h2>
      <button type="button" style="background:#334155; color:#fff; margin-bottom:10px;" onclick="cargarEjemplo()">Cargar Datos de Ejemplo</button>
      <textarea id="dataInput" rows="8"></textarea>
      <select id="horizon">
        <option value="5 años">5 Años</option>
        <option value="10 años" selected>10 Años</option>
        <option value="15+ años">15+ Años</option>
      </select>
    </div>

    <div class="card">
      <h2>🤖 3. Generar Ranking</h2>
      <button onclick="analizarAcciones()">🚀 Analizar y Crear Ranking</button>
    </div>

    <div class="card">
      <h2>🏆 Resultados</h2>
      <div id="output">Los resultados aparecerán aquí.</div>
    </div>
  </div>

  <script>
    function cargarEjemplo() {
      document.getElementById('dataInput').value = `Ticker, Empresa, Sector, Precio($), PER, ROE(%), CrecimientoVentas5A(%), MargenNeto(%), DeudaEbitda, RentabilidadDividendos(%)
NVDA, Nvidia Corp, Tecnología, 120, 45, 115, 48.0, 55, 0.2, 0.1
MSFT, Microsoft Corp, Tecnología, 440, 35, 38, 14.2, 36, 0.8, 0.7
AAPL, Apple Inc, Tecnología, 225, 33, 145, 8.5, 24, 0.9, 0.5
GOOGL, Alphabet Inc, Tecnología, 175, 24, 30, 15.5, 25, 0.1, 0.5
KO, Coca-Cola Co, Consumo, 68, 24, 40, 4.1, 23, 2.1, 3.1
JNJ, Johnson & Johnson, Salud, 160, 18, 22, 5.0, 19, 1.4, 3.2`;
    }

    async function analizarAcciones() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const datos = document.getElementById('dataInput').value.trim();
      const horizonte = document.getElementById('horizon').value;
      const outputDiv = document.getElementById('output');

      if (!apiKey || !datos) { alert('Rellena la API Key y los datos.'); return; }

      outputDiv.innerText = "⏳ Analizando con la IA...";

      const promptSistema = `Analiza estos datos financieros para una inversión a ${horizonte}. Crea un ranking numerado del #1 al final ordenado por rentabilidad potencial, justifica el top 3 y menciona riesgos:\n\n${datos}`;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptSistema }] }] })
        });
        const json = await response.json();
        if (json.candidates && json.candidates[0]) {
          outputDiv.innerText = json.candidates[0].content.parts[0].text;
        } else if (json.error) {
          outputDiv.innerText = "Error API: " + json.error.message;
        } else {
          outputDiv.innerText = "Respuesta: " + JSON.stringify(json);
        }
      } catch (e) {
        outputDiv.innerText = "Error conexión: " + e.message;
      }
    }
  </script>
</body>
</html>
